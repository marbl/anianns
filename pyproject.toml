[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anianns"
version = "0.7.0"
description = "A Python package for annotating large tandem repeats"
authors = [
    { name="Alex Sweeten", email="alex.sweeten@nih.gov" }
]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["genomics", "bioinformatics", "repeatmasker", "tandem repeat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "alive-progress>=3.3,<4",
    "pyGenomeTracks",
    "pysam",
    "setproctitle",
    "numpy",
    "polars",
    "mmh3",
    "numba",
    "matplotlib",
    "seaborn",
]
[project.optional-dependencies]
moddotplot = ["moddotplot"]
dev = ["black", "coverage", "jupyter", "ipykernel", "pytest", "pytest-cov", "biopython", "seaborn"]
[project.scripts]
anianns = "anianns.__main__:main"
anianns_kmer_db = "anianns.build_kmer_db:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=anianns --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["anianns"]
omit = [
    "src/anianns/refine_boundaries.py",
    "src/anianns/parse_matrix.py",
    "src/anianns/union_find.py",
]
